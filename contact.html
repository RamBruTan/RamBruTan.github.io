<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RamBruTan — Contact</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --color-bg:      #00000a;
      --color-text:    #d8dcf0;
      --color-muted:   #45485e;
      --color-blue:    rgb(100, 180, 255);
      --color-purple:  rgb(160, 100, 255);
      --color-pink:    rgb(255, 100, 180);
      --nav-height:    54px;

      /* Card background */
      --card-bg:       rgba(8, 6, 18, 0.82);
      --card-border:   rgba(100, 180, 255, 0.07);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }

    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: 'Outfit', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { text-decoration: none; color: inherit; }
    ::selection { background: rgba(140, 60, 255, 0.4); color: #fff; }


    /* Canvas, fixed background */
    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 0;
    }


    /* Nav, fixed navigation bar */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 300;
      height: var(--nav-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2.5rem;
      background: rgba(4, 2, 14, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 2px solid rgba(255, 60, 155, 0.75);
    }

    .nav-logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #fff;
    }
    .nav-logo .accent { color: var(--color-blue); }

    .nav-links { list-style: none; display: flex; gap: 2.5rem; }
    .nav-links a {
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      color: var(--color-muted);
      transition: color 0.2s ease;
    }
    .nav-links a:hover { color: var(--color-pink); }


    /* Main scroll wrapper */
    main {
      position: relative;
      z-index: 1;
      padding: calc(var(--nav-height) + 3rem) 2rem 6rem;
      max-width: 700px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    /* Page heading */
    .page-heading {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 900;
      letter-spacing: 0.1em;
      color: #fff;
      text-align: center;
      margin-bottom: 0.75rem;
      text-shadow:
        0 0 60px rgba(140, 60, 255, 0.45),
        0 0 120px rgba(68, 155, 255, 0.12);
    }

    .page-subheading {
      font-size: 0.95rem;
      color: var(--color-muted);
      text-align: center;
      margin-bottom: 3rem;
      line-height: 1.7;
    }

    /* The card that the text sits on */
    .contact-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow: hidden;
    }

    /* Each contact row */
    .contact-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.85rem 1.5rem;
      border-bottom: 1px solid var(--card-border);
      transition: background 0.2s ease;
    }

    .contact-row:last-child {
      border-bottom: none;
    }

    .contact-row:hover {
      background: rgba(100, 180, 255, 0.03);
    }

    /* contact-row used as a plain div (copy rows) gets pointer cursor */
    .contact-row.is-copy {
      cursor: pointer;
    }

    /* Icon */
    .contact-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .contact-icon svg {
      width: 16px;
      height: 16px;
      fill: var(--color-pink);
    }

    /* Label */
    .contact-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--color-pink);
      flex-shrink: 0;
      min-width: 90px;
    }

    /* Value */
    .contact-value {
      font-size: 0.88rem;
      color: var(--color-text);
      margin-left: auto;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      user-select: text;
    }

    /* Footer, also on card */
    footer {
      position: relative;
      z-index: 1;
      background: rgba(4, 2, 14, 0.90);
      border-top: 1px solid rgba(255, 60, 155, 0.20);
      padding: 1.75rem 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .footer-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.56rem;
      letter-spacing: 0.22em;
      color: var(--color-muted);
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: rgba(160, 100, 255, 0.25); border-radius: 2px; }

    @media (max-width: 600px) {
      nav { padding: 0 1.25rem; }
      .nav-links { gap: 1.5rem; }
      main { padding: calc(var(--nav-height) + 2rem) 1.25rem 4rem; }
      .contact-row { padding: 1.5rem; gap: 1rem; }
    }
  </style>
</head>
<body>

  <!-- Fixed canvas background, never scrolls -->
  <canvas id="canvas"></canvas>

  <!-- Fixed nav sits above the canvas -->
  <nav>
    <a href="https://github.com/RamBruTan" class="nav-logo">RamBruTan<span class="accent">.</span></a>
    <ul class="nav-links">
      <li><a href="index.html#about">About</a></li>
      <li><a href="projects.html">Work & Projects</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <!-- Everything inside main scrolls over the fixed canvas -->
  <main>

    <h1 class="page-heading">Contact</h1>
    <p class="page-subheading">Feel free to reach out!</p>

    <div class="contact-card">

      <!-- Email -->
      <div class="contact-row is-copy" onclick="selectText(this.querySelector('.contact-value'))">
        <div class="contact-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9
                     2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
        </div>
        <span class="contact-label">E-mail:</span>
        <span class="contact-value">bruce.xtan@gmail.com</span>
      </div>

      <!-- GitHub -->
      <a class="contact-row" href="https://github.com/RamBruTan" target="_blank">
        <div class="contact-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.5.5.09.68-.22.68-.48v-1.7
                     c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.1-1.46-1.1-1.46-.9-.62.07-.6.07-.6
                     1 .07 1.53 1.03 1.53 1.03.89 1.52 2.34 1.08 2.91.83.09-.65.35-1.08.63-1.33
                     -2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.26-.45-1.27.1-2.64
                     0 0 .84-.27 2.75 1.02A9.56 9.56 0 0 1 12 6.8a9.6 9.6 0 0 1 2.5.34
                     c1.91-1.3 2.75-1.02 2.75-1.02.55 1.37.2 2.38.1 2.64.64.7 1.03 1.59 1.03 2.68
                     0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.75c0 .27.18.58.69.48
                     A10.01 10.01 0 0 0 22 12c0-5.52-4.48-10-10-10z"/>
          </svg>
        </div>
        <span class="contact-label">GitHub:</span>
        <span class="contact-value">github.com/RamBruTan</span>
      </a>

    </div>

  </main>

  <footer>
    <span class="footer-text">© 2026 RamBruTan. All rights reserved.</span>
  </footer>


  <script>

    // Select text helper to auto-highlight text on click
    function selectText(element) {
      const range     = document.createRange();
      const selection = window.getSelection();
      range.selectNodeContents(element);
      selection.removeAllRanges();
      selection.addRange(range);
    }


    // CANVAS SETUP
    // The canvas is position:fixed in CSS, so its sized to fill the screen and never move it.

    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d');
    const DPR    = Math.min(window.devicePixelRatio || 1, 2);

    let canvasWidth  = 0;
    let canvasHeight = 0;

    function resizeCanvas() {
      canvasWidth  = window.innerWidth;
      canvasHeight = window.innerHeight;
      canvas.width  = Math.round(canvasWidth  * DPR);
      canvas.height = Math.round(canvasHeight * DPR);
      canvas.style.width  = canvasWidth  + 'px';
      canvas.style.height = canvasHeight + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      rebuildStars();
    }

    window.addEventListener('resize', resizeCanvas);


    // star background

    const STAR_COUNT = 220;
    let stars = [];

    function rebuildStars() {
      stars = [];
      for (let i = 0; i < STAR_COUNT; i++) {
        stars.push({
          x:         Math.random() * canvasWidth,
          y:         Math.random() * canvasHeight,
          radius:    Math.random() * 0.9 + 0.15,
          baseAlpha: Math.random() * 0.5 + 0.12,
          phase:     Math.random() * Math.PI * 2,
          frequency: Math.random() * 0.5 + 0.2,
        });
      }
    }

    function drawStars(timeSeconds) {
      for (const star of stars) {
        const alpha = star.baseAlpha * (0.5 + 0.5 * Math.sin(timeSeconds * star.frequency + star.phase));
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200, 210, 255, ${alpha.toFixed(3)})`;
        ctx.fill();
      }
    }


    // Draw frame

    function drawFrame(timestamp) {

      // Semi-transparent clear, leaves a faint trail
      ctx.fillStyle = 'rgba(0, 0, 8, 0.22)';
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      drawStars(timestamp * 0.001);
    }


    // Main loop

    function animationLoop(timestamp) {
      drawFrame(timestamp);
      requestAnimationFrame(animationLoop);
    }


    // Start

    resizeCanvas();
    requestAnimationFrame(animationLoop);

  </script>
</body>
</html>
