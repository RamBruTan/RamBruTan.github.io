<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RamBruTan — Contact</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="global.css" />
</head>
<body  class="page-contact">

  <!-- Fixed canvas background, never scrolls -->
  <canvas id="canvas"></canvas>

  <!-- Fixed nav sits above the canvas -->
  <nav>
    <a href="https://github.com/RamBruTan" class="nav-logo">RamBruTan<span class="accent"></span></a>
    <ul class="nav-links">
      <li><a href="index.html#about">About</a></li>
      <li><a href="projects.html">Work & Projects</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <!-- Everything inside main scrolls over the fixed canvas -->
  <main>

    <h1 class="page-heading">Contact</h1>
    <p class="page-subheading">Feel free to reach out!</p>

    <div class="contact-card">

      <!-- Email -->
      <div class="contact-row is-copy" onclick="selectText(this.querySelector('.contact-value'))">
        <div class="contact-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9
                     2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
        </div>
        <span class="contact-label">E-mail:</span>
        <span class="contact-value">bruce.xtan@gmail.com</span>
      </div>

      <!-- GitHub -->
      <a class="contact-row" href="https://github.com/RamBruTan" target="_blank">
        <div class="contact-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.5.5.09.68-.22.68-.48v-1.7
                     c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.1-1.46-1.1-1.46-.9-.62.07-.6.07-.6
                     1 .07 1.53 1.03 1.53 1.03.89 1.52 2.34 1.08 2.91.83.09-.65.35-1.08.63-1.33
                     -2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.26-.45-1.27.1-2.64
                     0 0 .84-.27 2.75 1.02A9.56 9.56 0 0 1 12 6.8a9.6 9.6 0 0 1 2.5.34
                     c1.91-1.3 2.75-1.02 2.75-1.02.55 1.37.2 2.38.1 2.64.64.7 1.03 1.59 1.03 2.68
                     0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.75c0 .27.18.58.69.48
                     A10.01 10.01 0 0 0 22 12c0-5.52-4.48-10-10-10z"/>
          </svg>
        </div>
        <span class="contact-label">GitHub:</span>
        <span class="contact-value">github.com/RamBruTan</span>
      </a>

    </div>

  </main>

  <footer>
    <span class="footer-text">© 2026 RamBruTan. All rights reserved.</span>
  </footer>


  <script>

    // Select text helper to auto-highlight text on click
    function selectText(element) {
      const range     = document.createRange();
      const selection = window.getSelection();
      range.selectNodeContents(element);
      selection.removeAllRanges();
      selection.addRange(range);
    }


    // CANVAS SETUP
    // The canvas is position:fixed in CSS, so its sized to fill the screen and never move it.

    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d');
    const DPR    = Math.min(window.devicePixelRatio || 1, 2);

    let canvasWidth  = 0;
    let canvasHeight = 0;

    function resizeCanvas() {
      canvasWidth  = window.innerWidth;
      canvasHeight = window.innerHeight;
      canvas.width  = Math.round(canvasWidth  * DPR);
      canvas.height = Math.round(canvasHeight * DPR);
      canvas.style.width  = canvasWidth  + 'px';
      canvas.style.height = canvasHeight + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      rebuildStars();
    }

    window.addEventListener('resize', resizeCanvas);


    // star background

    const STAR_COUNT = 220;
    let stars = [];

    function rebuildStars() {
      stars = [];
      for (let i = 0; i < STAR_COUNT; i++) {
        stars.push({
          x:         Math.random() * canvasWidth,
          y:         Math.random() * canvasHeight,
          radius:    Math.random() * 0.9 + 0.15,
          baseAlpha: Math.random() * 0.5 + 0.12,
          phase:     Math.random() * Math.PI * 2,
          frequency: Math.random() * 0.5 + 0.2,
        });
      }
    }

    function drawStars(timeSeconds) {
      for (const star of stars) {
        const alpha = star.baseAlpha * (0.5 + 0.5 * Math.sin(timeSeconds * star.frequency + star.phase));
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200, 210, 255, ${alpha.toFixed(3)})`;
        ctx.fill();
      }
    }


    // Draw frame

    function drawFrame(timestamp) {

      // Semi-transparent clear, leaves a faint trail
      ctx.fillStyle = 'rgba(0, 0, 8, 0.22)';
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      drawStars(timestamp * 0.001);
    }


    // Main loop

    function animationLoop(timestamp) {
      drawFrame(timestamp);
      requestAnimationFrame(animationLoop);
    }


    // Start

    resizeCanvas();
    requestAnimationFrame(animationLoop);

  </script>
</body>
</html>
